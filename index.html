<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cupcake</title>
    <style>
        /* Estilos Gerais */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f4f4;
        }

        /* Barra de Navegação Superior (Navbar) */
        .navbar {
            background-color: #2b2b2b;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 30px;
            font-size: 14px;
        }

        .nav-left, .nav-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-brand {
            font-weight: bold;
            font-size: 16px;
        }

        .nav-link {
            color: #ddd;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .nav-link:hover {
            color: white;
        }

        /* Container Principal */
        .main-container {
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .container {
            display: flex;
            width: 100%;
            max-width: 1200px;
            gap: 20px;
        }

        /* Barra Lateral (Sidebar) */
        .sidebar {
            width: 220px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .menu-title {
            background-color: #a44eaa;
            color: white;
            padding: 12px 15px;
            font-weight: bold;
            border-radius: 4px;
        }

        .menu-list {
            list-style: none;
            padding-left: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .menu-list a {
            text-decoration: none;
            color: #a44eaa;
            font-size: 14px;
        }

        .menu-list a:hover {
            text-decoration: underline;
        }

        /* Conteúdo Principal */
        .main-content {
            flex: 1;
            background-color: white;
            border: 1px solid #dcdcdc;
            display: flex;
            flex-direction: column;
        }

        .content-header {
            background-color: #a44eaa;
            color: white;
            padding: 15px;
            font-weight: bold;
        }

        /* Grelha de Produtos */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            padding: 20px;
            flex: 1;
        }

        .product-card {
            border: 1px solid #a44eaa;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-color: white;
        }

        .product-title {
            background-color: #a44eaa;
            color: white;
            padding: 10px;
            font-size: 14px;
            font-weight: bold;
        }

        .product-image {
            width: 100%;
            height: 180px;
            object-fit: contain;
            padding: 15px;
            background-color: #fff;
        }

        .product-footer {
            background-color: #a44eaa;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .product-price {
            color: white;
            font-size: 14px;
            font-weight: bold;
        }

        .btn-buy {
            background-color: #5d31b0;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 3px;
            font-size: 12px;
            cursor: pointer;
        }

        .btn-buy:hover {
            background-color: #4c19aa;
        }

        /* Rodapé */
        .footer {
            border-top: 1px solid #dcdcdc;
            padding: 15px 20px;
            color: #666;
            font-size: 13px;
            background-color: #fafafa;
        }
    </style>
</head>
<body>

    <!-- Barra de Navegação Superior -->
    <header class="navbar">
        <div class="nav-left">
            <span class="nav-brand">Cupcake</span>
            <a href="#" class="nav-link">&#8962; Início</a>
        </div>
        <div class="nav-right">
            <a href="carrinho.html" class="nav-link">&#128722; Carrinho <span id="cart-count" style="background: #555; padding: 2px 6px; border-radius: 10px; font-size: 12px;">0</span></a>
            <a href="javascript:void(0);" class="nav-link" id="link-usuario" onclick="abrirAuth()">&#128100; Entrar/Registrar</a>
        </div>
    </header>

    <!-- Corpo com Sidebar e Produtos -->
    <div class="main-container">
        <div class="container">
            <!-- Seção Principal -->
            <main class="main-content">
                <div class="content-header">Cupcakes</div>

                <!-- Grade correta onde os produtos do JSON serão injetados -->
                <div class="products-grid" id="produtos-container"></div>

                <!-- Mensagem de status -->
                <div id="mensagem-status" style="margin-top: 15px; text-align: center; font-weight: bold; color: #938294;"></div>
            </main>
        </div>
    </div>

    <!-- Modal de Login e Registro -->
    <div id="modal-auth" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 2000;">
        <div style="background: white; padding: 25px; border-radius: 8px; width: 380px; max-width: 90%; display: flex; flex-direction: column; gap: 15px; position: relative; box-shadow: 0 4px 10px rgba(0,0,0,0.3);">
            
            <!-- Botão Fechar -->
            <button onclick="fecharAuth()" style="position: absolute; top: 10px; right: 15px; background: none; border: none; font-size: 18px; cursor: pointer; color: #666;">&times;</button>
            
            <!-- Abas Navegáveis -->
            <div style="display: flex; border-bottom: 2px solid #eee; gap: 10px;">
                <button id="tab-login" onclick="alternarAba('login')" style="flex: 1; padding: 10px; border: none; background: none; font-weight: bold; color: #a44eaa; border-bottom: 2px solid #a44eaa; cursor: pointer;">Entrar</button>
                <button id="tab-registro" onclick="alternarAba('registro')" style="flex: 1; padding: 10px; border: none; background: none; font-weight: bold; color: #666; cursor: pointer;">Registrar</button>
            </div>

            <!-- Formulário de Login -->
            <form id="form-login" onsubmit="fazerLogin(event)" style="display: flex; flex-direction: column; gap: 12px;">
                <div>
                    <label style="font-size: 12px; color: #333; font-weight: bold;">E-mail</label>
                    <input type="email" id="login-email" required placeholder="seu@email.com" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; margin-top: 4px;">
                </div>
                <div>
                    <label style="font-size: 12px; color: #333; font-weight: bold;">Senha</label>
                    <input type="password" id="login-senha" required placeholder="********" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; margin-top: 4px;">
                </div>
                <button type="submit" style="background-color: #5d31b0; color: white; border: none; padding: 10px; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 5px;">Entrar</button>
            </form>

            <!-- Formulário de Registro -->
            <form id="form-registro" onsubmit="cadastrarUsuario(event)" style="display: none; flex-direction: column; gap: 12px;">
                <div>
                    <label style="font-size: 12px; color: #333; font-weight: bold;">Nome Completo</label>
                    <input type="text" id="reg-nome" required placeholder="Seu Nome" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; margin-top: 4px;">
                </div>
                <div>
                    <label style="font-size: 12px; color: #333; font-weight: bold;">E-mail</label>
                    <input type="email" id="reg-email" required placeholder="seu@email.com" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; margin-top: 4px;">
                </div>
                <div>
                    <label style="font-size: 12px; color: #333; font-weight: bold;">Senha</label>
                    <input type="password" id="reg-senha" required placeholder="********" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; margin-top: 4px;">
                </div>
                <button type="submit" style="background-color: #a44eaa; color: white; border: none; padding: 10px; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 5px;">Criar Conta</button>
            </form>

        </div>
    </div>

    <!-- Modal de Gerenciamento de Conta (Perfil) -->
    <div id="modal-usuario" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 2000;">
        <div style="background: white; padding: 25px; border-radius: 8px; width: 360px; max-width: 90%; display: flex; flex-direction: column; gap: 15px; position: relative; box-shadow: 0 4px 10px rgba(0,0,0,0.3);">
            
            <!-- Botão Fechar -->
            <button onclick="fecharMenuUsuario()" style="position: absolute; top: 10px; right: 15px; background: none; border: none; font-size: 18px; cursor: pointer; color: #666;">&times;</button>
            
            <h3 style="color: #a44eaa; border-bottom: 2px solid #a44eaa; padding-bottom: 8px;">Minha Conta</h3>

            <!-- Menu de Opções (Visível por padrão) -->
            <div id="menu-opcoes" style="display: flex; flex-direction: column; gap: 10px;">
                <button onclick="abrirMeusPedidos()" style="background-color: #a44eaa; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; font-weight: bold;">Meus Pedidos</button>
                <button onclick="mostrarFormSenha()" style="background-color: #5d31b0; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; font-weight: bold;">Trocar Senha</button>
                <button onclick="fazerLogout()" style="background-color: #d9534f; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; font-weight: bold;">Sair (Logout)</button>
            </div>

            <!-- Formulário de Troca de Senha (Oculto inicialmente) -->
            <form id="form-trocar-senha" onsubmit="atualizarSenha(event)" style="display: none; flex-direction: column; gap: 12px;">
                <div>
                    <label style="font-size: 12px; font-weight: bold; color: #333;">Nova Senha</label>
                    <input type="password" id="nova-senha" required placeholder="Digite a nova senha" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; margin-top: 4px;">
                </div>
                <div style="display: flex; gap: 10px; margin-top: 5px;">
                    <button type="submit" style="background-color: #a44eaa; color: white; border: none; padding: 9px; border-radius: 4px; cursor: pointer; flex: 1; font-weight: bold;">Salvar</button>
                    <button type="button" onclick="voltarMenuOpcoes()" style="background-color: #ccc; border: none; padding: 9px; border-radius: 4px; cursor: pointer; flex: 1; font-weight: bold; color: #333;">Voltar</button>
                </div>
            </form>

        </div>
    </div>

    <!-- Modal de Meus Pedidos -->
    <div id="modal-pedidos" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 2000;">
        <div style="background: white; padding: 25px; border-radius: 8px; width: 450px; max-width: 90%; max-height: 80vh; display: flex; flex-direction: column; gap: 15px; position: relative; box-shadow: 0 4px 10px rgba(0,0,0,0.3);">
            
            <!-- Botão Fechar -->
            <button onclick="fecharMeusPedidos()" style="position: absolute; top: 10px; right: 15px; background: none; border: none; font-size: 18px; cursor: pointer; color: #666;">&times;</button>
            
            <h3 style="color: #a44eaa; border-bottom: 2px solid #a44eaa; padding-bottom: 8px;">📦 Seus Pedidos Efetuados</h3>

            <!-- Container onde a lista de pedidos será injetada com scroll caso seja grande -->
            <div id="lista-pedidos-modal" style="overflow-y: auto; max-height: 50vh; display: flex; flex-direction: column; gap: 12px; padding-right: 5px;">
                <!-- Os pedidos entram aqui dinamicamente -->
            </div>

            <button onclick="fecharMeusPedidos()" style="background-color: #5d31b0; color: white; border: none; padding: 10px; border-radius: 4px; font-weight: bold; cursor: pointer;">Fechar</button>
        </div>
    </div>
    
    <script src="script.js">
    </script>

</body>
</html>
